<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Civil Engineering Attendance Cloud Tracker</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --present: #16a34a;
      --absent: #dc2626;
      --late: #d97706;
      --unmarked: #64748b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem;
      margin: 0;
    }
    .container {
      max-width: 98%;
      margin: 0 auto;
      background: var(--card);
      padding: 1.25rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .sync-status {
      font-size: 0.85rem;
      font-weight: 600;
      color: #0284c7;
    }
    .actions-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend {
      display: flex;
      gap: 0.75rem;
      font-size: 0.85rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .legend span {
      display: inline-block;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      border-radius: 4px;
      font-weight: 700;
      color: white;
    }
    .badge-empty { background: #e2e8f0; color: #475569 !important; }
    .badge-p { background: var(--present); }
    .badge-a { background: var(--absent); }
    .badge-l { background: var(--late); }

    .btn {
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .print-btn {
      background: #2563eb;
      color: white;
    }
    .print-btn:hover { background: #1d4ed8; }
    .reset-btn {
      background: #ef4444;
      color: white;
    }
    .reset-btn:hover { background: #dc2626; }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    th, td {
      padding: 0.45rem 0.5rem;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid #e2e8f0;
    }
    th {
      background: #f1f5f9;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    .sticky-col {
      position: sticky;
      left: 0;
      background: white;
      z-index: 2;
    }
    th.sticky-col {
      background: #f1f5f9;
      z-index: 3;
    }
    .status-select {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.15rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: pointer;
      text-align: center;
      outline: none;
      width: 48px;
    }
    .status-select.sel-empty { background: #f1f5f9; color: var(--unmarked); border-color: #cbd5e1; }
    .status-select.sel-P { background: #dcfce7; color: var(--present); border-color: #86efac; }
    .status-select.sel-A { background: #fee2e2; color: var(--absent); border-color: #fca5a5; }
    .status-select.sel-L { background: #fef3c7; color: var(--late); border-color: #fde68a; }

    .print-val { display: none; }

    /* Print & PDF Layout Styling */
    @media print {
      body {
        background: white !important;
        padding: 0 !important;
        color: black !important;
      }
      .container {
        max-width: 100% !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .actions-bar, .sync-status, .legend {
        display: none !important;
      }
      .table-wrapper {
        border: none !important;
        overflow: visible !important;
      }
      table {
        font-size: 8pt !important;
        border-collapse: collapse !important;
        width: 100% !important;
      }
      th, td {
        padding: 3px 4px !important;
        border: 1px solid #94a3b8 !important;
      }
      th {
        background: #f1f5f9 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .status-select {
        display: none !important;
      }
      .print-val {
        display: inline-block !important;
        font-weight: bold;
        text-align: center;
        width: 100%;
      }
      .sticky-col {
        position: static !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h2 style="margin: 0; font-size: 1.25rem;">Civil Engineering - 10-Day Attendance</h2>
        <span class="sync-status" id="sync-status">Connecting to live database...</span>
      </div>
      <div class="actions-bar">
        <div class="legend">
          <div><span class="badge-empty">-</span> Unmarked</div>
          <div><span class="badge-p">P</span> Present</div>
          <div><span class="badge-a">A</span> Absent</div>
          <div><span class="badge-l">L</span> Late</div>
        </div>
        <button class="btn print-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
        <button class="btn reset-btn" onclick="resetAll()">Clear Sheet</button>
      </div>
    </header>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="sticky-col">Sl.</th>
            <th>USN</th>
            <th>Name</th>
            <th>Team</th>
            <th style="text-align:center;">D1</th>
            <th style="text-align:center;">D2</th>
            <th style="text-align:center;">D3</th>
            <th style="text-align:center;">D4</th>
            <th style="text-align:center;">D5</th>
            <th style="text-align:center;">D6</th>
            <th style="text-align:center;">D7</th>
            <th style="text-align:center;">D8</th>
            <th style="text-align:center;">D9</th>
            <th style="text-align:center;">D10</th>
            <th style="text-align:center;">Att. %</th>
          </tr>
        </thead>
        <tbody id="roster-body"></tbody>
      </table>
    </div>
  </div>

  <script>

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const attendanceRef = db.ref('attendance_records');

    const studentList = [

      { id: 53, usn: "2GO25CV420", name: "SIDDESH NS", team: "Team C" },
      { id: 54, usn: "2GO25CV421", name: "SNEHA D", team: "Team A" },
      { id: 55, usn: "2GO25CV422", name: "SRUJAN K S", team: "Team C" },
      { id: 56, usn: "2GO25CV423", name: "SUHAS. R. M", team: "Team D" },
      { id: 57, usn: "2GO25CV424", name: "UDITH KUMAR. G. M", team: "Team D" },
      { id: 58, usn: "2GO25CV425", name: "VARSHA", team: "Team C" },
      { id: 59, usn: "2GO25CV426", name: "VIKAS LP", team: "Team B" },
      { id: 60, usn: "2GO25CV427", name: "YASHODA", team: "Team D" }
    ];

    let records = [];

    function renderTable() {
      const tbody = document.getElementById('roster-body');
      tbody.innerHTML = '';

      records.forEach((s, sIdx) => {
        const tr = document.createElement('tr');
        
        let present = s.days ? s.days.filter(d => d === 'P').length : 0;
        let late = s.days ? s.days.filter(d => d === 'L').length : 0;
        let marked = s.days ? s.days.filter(d => d !== '').length : 0;
        let percentageDisplay = marked === 0 ? '-' : Math.round(((present + (late * 0.5)) / marked) * 100) + '%';

        let dayDropdowns = (s.days || Array(10).fill("")).map((val, dIdx) => `
          <td style="text-align:center; padding: 2px;">
            <select class="status-select sel-${val || 'empty'}" onchange="updateDay(${sIdx}, ${dIdx}, this.value)">
              <option value="" ${val === '' ? 'selected' : ''}>-</option>
              <option value="P" ${val === 'P' ? 'selected' : ''}>P</option>
              <option value="A" ${val === 'A' ? 'selected' : ''}>A</option>
              <option value="L" ${val === 'L' ? 'selected' : ''}>L</option>
            </select>
            <span class="print-val">${val || '-'}</span>
          </td>
        `).join('');

        tr.innerHTML = `
          <td class="sticky-col">${sIdx + 1}</td>
          <td><code>${s.usn}</code></td>
          <td><strong>${s.name}</strong></td>
          <td>${s.team}</td>
          ${dayDropdowns}
          <td style="text-align:center; font-weight:700;">${percentageDisplay}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Preserves and pulls existing cloud data
    attendanceRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        records = data;
      } else {
        records = studentList.map(s => ({ ...s, days: Array(10).fill("") }));
        attendanceRef.set(records);
      }
      document.getElementById('sync-status').textContent = "● Live synced to cloud";
      document.getElementById('sync-status').style.color = "#16a34a";
      renderTable();
    });

    function updateDay(sIdx, dIdx, value) {
      if (!records[sIdx].days) records[sIdx].days = Array(10).fill("");
      records[sIdx].days[dIdx] = value;
      attendanceRef.child(`${sIdx}/days/${dIdx}`).set(value);
    }

    function resetAll() {
      if (confirm("Are you sure you want to clear attendance for all students?")) {
        records = studentList.map(s => ({ ...s, days: Array(10).fill("") }));
        attendanceRef.set(records);
      }
    }
  </script>
</body>
</html>
