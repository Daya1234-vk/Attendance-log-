<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lab Attendance Log</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --present: #16a34a;
      --absent: #dc2626;
      --late: #d97706;
      --unmarked: #64748b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem;
      margin: 0;
    }
    .container {
      max-width: 98%;
      margin: 0 auto;
      background: var(--card);
      padding: 1.25rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      font-size: 0.85rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    th, td {
      padding: 0.45rem 0.5rem;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid #e2e8f0;
      background: var(--card);
    }
    th {
      background: #f1f5f9;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    /* Only Name column is static */
    .sticky-name {
      position: sticky;
      left: 0;
      z-index: 20;
      min-width: 170px;
      background: var(--card);
      box-shadow: 2px 0 5px rgba(0,0,0,0.08);
    }
    th.sticky-name {
      background: #f1f5f9;
      z-index: 30;
    }

    .date-header {
      text-align: center;
      padding: 4px;
    }
    .date-input {
      font-family: inherit;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 4px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
    }
    .status-select {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.15rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: pointer;
      text-align: center;
      outline: none;
      width: 48px;
    }
    .status-select.sel-empty { background: #f1f5f9; color: var(--unmarked); border-color: #cbd5e1; }
    .status-select.sel-P { background: #dcfce7; color: var(--present); border-color: #86efac; }
    .status-select.sel-A { background: #fee2e2; color: var(--absent); border-color: #fca5a5; }
    .status-select.sel-L { background: #fef3c7; color: var(--late); border-color: #fde68a; }

    .btn {
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .btn-add { background: #0284c7; }
    .btn-add:hover { background: #0369a1; }
    .btn-reset { background: #ef4444; }
    .btn-reset:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2 style="margin: 0; font-size: 1.25rem;">Lab Attendance Log (Batch 1 - 20 Students)</h2>
      <div class="controls">
        <button class="btn btn-add" onclick="addColumn()">+ Add Date Column</button>
        <button class="btn btn-reset" onclick="resetAll()">Clear Log</button>
      </div>
    </header>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr id="header-row"></tr>
        </thead>
        <tbody id="roster-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const batchStudents = [
      { usn: "2GO24CV001", name: "ABHINAYA" },
      { usn: "2GO24CV003", name: "AISHWARYA K N" },
      { usn: "2GO24CV004", name: "ALFIYABANU K" },
      { usn: "2GO24CV005", name: "ARUNA" },
      { usn: "2GO24CV009", name: "CHETHANA K H" },
      { usn: "2GO24CV010", name: "DAYANAND" },
      { usn: "2GO24CV011", name: "HARSHA" },
      { usn: "2GO24CV012", name: "IMAMHUSEN R G" },
      { usn: "2GO24CV013", name: "KAVITHA" },
      { usn: "2GO24CV014", name: "KAVYA B" },
      { usn: "2GO24CV015", name: "KAVYA I" },
      { usn: "2GO24CV016", name: "KIRAN M M" },
      { usn: "2GO24CV017", name: "LAXMAVVA" },
      { usn: "2GO24CV018", name: "LAXMEE Y H" },
      { usn: "2GO24CV019", name: "MADHUMATHI" },
      { usn: "2GO24CV020", name: "MADHUSUDAN" },
      { usn: "2GO24CV021", name: "NAVEEN T Y" },
      { usn: "2GO24CV022", name: "NIKITA" },
      { usn: "2GO24CV023", name: "NIVEDITA" },
      { usn: "2GO24CV024", name: "NIKIL P" }
    ];

    function getInitialDates() {
      return ["", "", "", "", "", ""];
    }

    function createInitialRecords() {
      return batchStudents.map(student => ({
        ...student,
        days: Array(6).fill("")
      }));
    }

    let dates = JSON.parse(localStorage.getItem('lab_attendance_dates')) || getInitialDates();
    let records = JSON.parse(localStorage.getItem('lab_attendance_records')) || createInitialRecords();

    function render() {
      localStorage.setItem('lab_attendance_dates', JSON.stringify(dates));
      localStorage.setItem('lab_attendance_records', JSON.stringify(records));

      const headerRow = document.getElementById('header-row');
      headerRow.innerHTML = `
        <th>Sl.</th>
        <th class="sticky-name">Name</th>
        <th>USN</th>
      `;

      dates.forEach((dVal, colIdx) => {
        headerRow.innerHTML += `
          <th class="date-header">
            <input type="date" class="date-input" value="${dVal}" onchange="updateDate(${colIdx}, this.value)" />
          </th>
        `;
      });

      headerRow.innerHTML += `<th style="text-align:center;">Att. %</th>`;

      const tbody = document.getElementById('roster-body');
      tbody.innerHTML = '';

      records.forEach((s, sIdx) => {
        const tr = document.createElement('tr');
        
        let present = s.days.filter(d => d === 'P').length;
        let late = s.days.filter(d => d === 'L').length;
        let marked = s.days.filter(d => d !== '').length;
        let percentageDisplay = marked === 0 ? '-' : Math.round(((present + (late * 0.5)) / marked) * 100) + '%';

        let dayDropdowns = s.days.map((val, dIdx) => `
          <td style="text-align:center; padding: 2px;">
            <select class="status-select sel-${val || 'empty'}" onchange="updateStatus(${sIdx}, ${dIdx}, this.value)">
              <option value="" ${val === '' ? 'selected' : ''}>-</option>
              <option value="P" ${val === 'P' ? 'selected' : ''}>P</option>
              <option value="A" ${val === 'A' ? 'selected' : ''}>A</option>
              <option value="L" ${val === 'L' ? 'selected' : ''}>L</option>
            </select>
          </td>
        `).join('');

        tr.innerHTML = `
          <td style="text-align:center;">${sIdx + 1}</td>
          <td class="sticky-name"><strong>${s.name}</strong></td>
          <td><code>${s.usn}</code></td>
          ${dayDropdowns}
          <td style="text-align:center; font-weight:700;">${percentageDisplay}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateDate(colIdx, value) {
      dates[colIdx] = value;
      render();
    }

    function updateStatus(sIdx, dIdx, value) {
      records[sIdx].days[dIdx] = value;
      render();
    }

    function addColumn() {
      dates.push("");
      records.forEach(student => student.days.push(""));
      render();
    }

    function resetAll() {
      dates = getInitialDates();
      records = createInitialRecords();
      render();
    }

    render();
  </script>
</body>
</html>
